name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      yggdrasil_ref:
        description: "yggdrasil-go tag to build the framework from"
        default: "v0.3.16"

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build Yggdrasil.framework
        run: |
          git clone --branch "${{ github.event.inputs.yggdrasil_ref }}" --depth 1 \
            https://github.com/yggdrasil-network/yggdrasil-go /tmp/yggdrasil-go
          cd /tmp/yggdrasil-go
          # old module needs newer x/sys to link with a modern Go, plus the gomobile bind package
          go get golang.org/x/sys@latest golang.org/x/mobile/bind@latest
          go mod tidy || true
          # the mobile package lives in different folders depending on the version
          MOBILE_DIR=$(grep -rl --include=*.go "^package mobile" . | xargs -n1 dirname | sort -u | head -n 1)
          echo "Mobile package dir: $MOBILE_DIR"
          test -n "$MOBILE_DIR"
          gomobile bind -target ios/arm64 -tags mobile -o Yggdrasil.xcframework \
            "github.com/yggdrasil-network/yggdrasil-go/${MOBILE_DIR#./}" \
            github.com/yggdrasil-network/yggdrasil-go/src/config
          find . -name "Yggdrasil.framework" -maxdepth 4
          FW=$(find Yggdrasil.xcframework -type d -name "Yggdrasil.framework" | grep -v simulator | head -n 1)
          echo "Using: $FW"
          cp -R "$FW" "$GITHUB_WORKSPACE/Yggdrasil.framework"

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project "Yggdrasil Network.xcodeproj" \
            -scheme YggdrasilNetwork \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Yggdrasil-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasil-unsigned-ipa
          path: Yggdrasil-unsigned.ipa
