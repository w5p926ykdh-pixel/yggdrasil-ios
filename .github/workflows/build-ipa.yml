name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build Yggdrasil.framework
        run: |
          git clone https://github.com/yggdrasil-network/yggdrasil-go /tmp/yggdrasil-go
          cd /tmp/yggdrasil-go
          ./build -i
          cp -R Yggdrasil.framework "$GITHUB_WORKSPACE/"

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project "Yggdrasil Network.xcodeproj" \
            -scheme YggdrasilNetwork \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Yggdrasil-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasil-unsigned-ipa
          path: Yggdrasil-unsigned.ipa
