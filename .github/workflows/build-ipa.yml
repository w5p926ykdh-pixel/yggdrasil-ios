name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      yggdrasil_ref:
        description: "yggdrasil-go tag (leave empty to auto-detect)"
        default: ""
        required: false

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: DEBUG - environment and repo layout
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcodebuild -list -project "Yggdrasil Network.xcodeproj" || true
          ls -la
          find . -maxdepth 2 -not -path "./.git/*" | head -60

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gomobile" init

      - name: Build Yggdrasil.framework
        run: |
          set -euxo pipefail
          go version
          git clone https://github.com/yggdrasil-network/yggdrasil-go /tmp/yggdrasil-go
          cd /tmp/yggdrasil-go

          REF="${{ github.event.inputs.yggdrasil_ref }}"
          set +x
          if [ -z "$REF" ]; then
            echo "=== DEBUG: searching tags for a mobile package with the API the app uses ==="
            for tag in $(git tag --sort=-v:refname | grep -E '^v0\.'); do
              pkg=$(git grep -l "^package mobile" "$tag" -- '*.go' | head -n 1 || true)
              if [ -n "$pkg" ]; then
                tun=$(git grep -l "TakeOverTUN" "$tag" -- '*.go' | head -n 1 || true)
                dht=$(git grep -l "GetDHTJSON" "$tag" -- '*.go' | head -n 1 || true)
                crd=$(git grep -l "GetCoordsString" "$tag" -- '*.go' | head -n 1 || true)
                echo "$tag  pkg=$pkg  takeOverTUN=${tun:+yes} dht=${dht:+yes} coords=${crd:+yes}"
                if [ -n "$tun" ] && [ -n "$dht" ] && [ -n "$crd" ] && [ -z "$REF" ]; then
                  REF="$tag"
                fi
              fi
            done
            echo "=== all tags that contain package mobile (any API) listed above ==="
          fi
          set -x
          if [ -z "$REF" ]; then
            echo "No yggdrasil-go tag has a mobile package matching this app. See the DEBUG list above."
            git grep -n "package mobile" $(git rev-parse HEAD) -- '*.go' || true
            git branch -a || true
            exit 1
          fi
          echo "Using yggdrasil-go ref: $REF"
          git checkout "$REF"

          # old module needs newer x/sys to link with a modern Go; add gomobile's bind package
          go get golang.org/x/sys@latest
          MOBILE_DIR=$(grep -rl --include=*.go "^package mobile" . | xargs -n1 dirname | sort -u | head -n 1)
          echo "Mobile package dir: $MOBILE_DIR"
          test -n "$MOBILE_DIR"
          go get golang.org/x/mobile/bind@latest
          gomobile bind -target ios/arm64 -tags mobile -o Yggdrasil.xcframework \
            "github.com/yggdrasil-network/yggdrasil-go/${MOBILE_DIR#./}" \
            github.com/yggdrasil-network/yggdrasil-go/src/config
          find . -name "Yggdrasil.framework" -maxdepth 4
          FW=$(find Yggdrasil.xcframework -type d -name "Yggdrasil.framework" | grep -v simulator | head -n 1)
          echo "Using: $FW"
          cp -R "$FW" "$GITHUB_WORKSPACE/Yggdrasil.framework"
          ls -la "$GITHUB_WORKSPACE/Yggdrasil.framework"

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "Yggdrasil Network.xcodeproj" \
            -scheme YggdrasilNetwork \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: DEBUG - show xcodebuild errors
        if: always()
        run: |
          grep -n "error:" xcodebuild.log | head -40 || true
          tail -n 60 xcodebuild.log || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products -name "*.app" -maxdepth 3 | head -n 1)
          echo "Found: $APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Yggdrasil-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Yggdrasil-unsigned-ipa
          path: Yggdrasil-unsigned.ipa
